<!DOCTYPE html>
<html>
<head>

<title>Proximate Debugger</title>
<script src="/viewer/libs/simple-json-viewer.min.js"></script>

<style>

    body, html { padding: 0; margin: 0; background: #444; color: white; }
    * { box-sizing: border-box; }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        min-height: 100vh; 
        overflow: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-weight: 700;
    }

    main {
        width: calc(100vw - 2em);
        height: calc(100vh - 2em);
        background: #333;
        border: 1px solid rgba(0,0,0,0.1);
        box-shadow: 0 5px 60px rgba(0,0,0,0.2);;
        margin: 20px auto 0;
        display: flex;
        gap: 1em;
        padding: 1em;
        margin: 0.5em;
        --nav-width: 250px;
    }

    main .json {
        display: block;
        margin: 0;
        width: calc(100% - var(--nav-width));
        height: 100%;
        background: #222;
        overflow: scroll;
    }

    main nav {
        width: var(--nav-width);
    }

        main nav div {
            margin: 0 0 1em;
        }

        main nav label {
            display: block;
        }

            main nav label span {
                font-family: monospace;
                background-color: black;
                color: greenyellow;
                margin: 1em;
            }

    main nav input, main nav select {
        width: 100%;
    }

    #printout {
        transition: opacity 0.2s linear;
    }

</style>

</head>

<body>
<main>
    <pre id="printout" class="json"></pre>
    <nav>
        <div>
            <label for="endpoint">Endpoint <span></span></label>
            <select id="endpoint" onchange="setEndpoint(this.value)"></select>
        </div>
        <div id="delay-params">
            <label for="delay">Delay (Mins)<span></span></label>
            <input id="delay" type="range" min="0" max="60" step="1" value="0" onchange="setDelay(this.value)" oninput="setProvisionalDelay(this.value)" />
        </div>
    </nav>
</main>
<script>

    let delay = 0;
    let endpointSelector = document.querySelector("select[id=endpoint]");
    let endpoint = endpointSelector.value;
    let timer = 0;
    let isUpdating = false;
    let isLoaded = false;
    let data;
    let jsv;
    let printElem = document.getElementById("printout");
    let results = {};

    const headerFields = ["head", "last", "first", "polled", "next", "log", "in-memory", "snapshots", "keys"];

    function init() {
        load();
    }

    function load() {
        fetch("/feeds").then(x => x.json()).then(feeds => {
            feeds.sort();
            const preferred = "playback/time";
            let hasPreffered = false;
            for (const feed of feeds) {
                var option = document.createElement("option");
                option.innerText = feed;
                endpointSelector.appendChild(option);
                if (feed == preferred) {
                    hasPreffered = true;
                }
            }
            if (hasPreffered) {
                endpoint = endpointSelector.value = preferred;
            }
            update();
        })
    }

    function update() {
        clearInterval(timer);
        updateLabels();
        timer = setInterval(nextTick, 500);
    }

    function updateLabels() {
        setLabelValue("delay", formatTime(delay));
        setLabelValue("endpoint", endpoint);
        document.getElementById("delay-params").style.visibility = endpoint.startsWith("playback") ? "visible" : "hidden";
        printElem.style.opacity = isLoaded ? "1.0" : "0.5";
    }

    function nextTick() {
        if (isUpdating) return;
        isUpdating = true;
        isLoaded = false;
        const url = `/${endpoint}?delay=${delay}`;
        updateLabels();
        setLabelValue("status", "sending");
        const requestStart = new Date();
        fetch(url)
            .then(response => {
                const { headers, status } = response;
                return response.text()
                    .then(text => ({ headers, status, text }))
                    .catch(e => ({ headers, status, text: "error" }));
            })
            .then(({ headers, status, text }) => {
                const isError = text === "error";
                isLoaded = true;
                results[endpoint] = { headers, status, text, isLoaded, isError };
                displayResults(results[endpoint]);
            })
            .catch(e => {
                isLoaded = false;
                console.error(e);
                updateLabels();
                setLabelValue("status", "error"); 
            })
            .finally(_ => isUpdating = false);
    }

    function displayResults(result, nowLoaded) {
        const container = document.querySelector(`main > .json`);
        if (result) {
            const { headers, status, text, isError } = result;
            if (typeof nowLoaded === "boolean") {
                isLoaded = nowLoaded;
            }
            let str = "";
            if (headers) {
                str += "Headers:\n\t";
                for (const pair of headers.entries()) {
                    str += pair[0] + '=' + pair[1] + ' ';
                }
            }
            str += '\nBody:\n';
            if (text && text?.match(/^\s*[\{\[]/)) {
                str += JSON.stringify(JSON.parse(text), null, "  ");
            } else {
                str += "(empty)";
            }
            container.innerText = str;
            const requestEnd = new Date();
            updateLabels();
            setLabelValue("status", "idle");
            for (const field of headerFields) {
                setLabelValue(field, headers.get(field))
            }
        } else {
            updateLabels();
            for (const field of headerFields) {
                setLabelValue(field, "");
            }
            container.innerText = "";
        }
    }

    function setLabelValue(label, value) {
        const container = document.querySelector("main > nav");
        let elem = container.querySelector(`label[for=${label}]`);
        if (!elem) {
            elem = document.createElement("label");
            elem.setAttribute("for", label);
            elem.innerText = label;

            const div = document.createElement("div");
            div.appendChild(elem);

            container.appendChild(div);
        }
        let span = elem.querySelector("span");
        if (!span) {
            span = document.createElement("span");
            elem.appendChild(span);
        }
        const dateMatch = value?.match(/\d{4}-[01]\d-[0-3]\dT[0-2]\d:[0-5]\d:[0-5]\d/);
        if (dateMatch) {
            value = formatDateTime(value);
        }
        span.innerText = value;
    }

    function setDelay(value) {
        delay = value * 60;
        update();
    }
    
    function setProvisionalDelay(value) {
        setLabelValue("delay", formatTime(value * 60));
    }

    function setEndpoint(value) {
        if (endpoint !== value) {
            endpoint = value;
            displayResults(results[endpoint], false);
            update();
        }
    }

    function getData() {
        return data;
    }

    function formatTime(seconds) {
        const secs = Math.floor(seconds % 60);
        const mins = Math.floor(seconds / 60);
        return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function formatDateTime(date) {
        if (typeof date === "string") {
            date = new Date(date);
        }
        if (!date || Number.isNaN(date.getTime())) {
            return "-";
        }
        return `${
                date.getHours()
            }:${
                date.getMinutes().toString().padStart(2, "0")
            }:${
                date.getSeconds().toString().padStart(2, "0")
            } ${
                date.getDate()}/${date.getMonth() + 1
            }`;
    }

    init();

</script>
</body>
</html>
