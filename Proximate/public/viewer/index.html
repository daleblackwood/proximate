<!DOCTYPE html>
<html>
<head>

<title>Proximate Debugger</title>
<script src="/viewer/libs/simple-json-viewer.min.js"></script>

<style>

  body, html { padding: 0; margin: 0; background: #444; color: white; }
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    min-height: 100vh; 
    overflow: hidden;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    font-weight: 700;
  }

  main {
    width: calc(100vw - 2em);
    height: calc(100vh - 2em);
    background: #333;
    border: 1px solid rgba(0,0,0,0.1);
    box-shadow: 0 5px 60px rgba(0,0,0,0.2);;
    margin: 20px auto 0;
    display: flex;
    gap: 1em;
    padding: 1em;
    margin: 1em;
    --nav-width: 150px;
  }

  main .json {
    display: block;
    margin: 0;
    width: calc(100% - var(--nav-width));
    height: 100%;
    background: #222;
    overflow: scroll;
  }

  main nav {
    width: var(--nav-width);
  }

  main nav div {
    margin: 0 0 1em;
  }

  main nav label {
    display: block;
  }

  main nav label span {
    font-family: monospace;
    background-color: black;
    color: greenyellow;
    margin: 1em;
  }

  main nav input, main nav select {
    width: 100%;
  }

</style>

</head>

<body>
<main>
  <pre class="json"></pre>
  <nav>
    <div>
      <label for="endpoint">Endpoint <span></span></label>
      <select id="endpoint" onchange="setEndpoint(this.value)">
        <option>proxy</option>
      </select>
    </div>
    <div>
      <label for="delay">Delay <span></span></label>
      <input id="delay" type="range" min="0" max="240" value="0" onchange="setDelay(this.value)" />
    </div>
  </nav>
</main>
<script>

  let delay = 0;
  let endpoint = document.querySelector("select[id=endpoint]").value
  let timer = 0;
  let isUpdating = false;
  let data;
  let jsv;

  function init() {
    update();
  }

  function update() {
    clearInterval(timer);
    setLabelValue("delay", delay + "ms");
    setLabelValue("endpoint", endpoint);
    timer = setInterval(nextTick, 200);
  }

  function nextTick() {
    if (isUpdating) return;
    isUpdating = true;
    const url = "/" + endpoint;
    fetch(url)
      .then(x => x.text())
      .then(x => {
        console.log("x", x);
        const container = document.querySelector(`main > .json`);
        const str = JSON.stringify(JSON.parse(x), null, "  ");
        container.innerText = str;
      })
      .finally(_ => isUpdating = false);
  }

  function setLabelValue(label, value) {
    const elem = document.querySelector(`main > nav label[for=${label}]`);
    let span = elem.querySelector("span");
    if (!span) {
      span = document.createElement("span");
      label.appendChild(span);
    }
    span.innerText = value;
  }

  function setDelay(value) {
    console.log(value);
    delay = value;
    update();
  }

  function setEndpoint(value) {
    endpoint = value;
    update();
  }

  function getData() {
    return data;
  }

  init();

</script>
</body>
</html>
