<!DOCTYPE html>
<html data-theme="dark">
<head>
<title>Proximate Debugger</title>
<link rel="stylesheet" href="viewer/styles.css"/>
<style>
    :root {
        --header-height: 70px;
    }
    body > header {
        padding: 1.8rem;
        display: flex;
        justify-content: space-between;
        height: var(--header-height);
        background-color: #00000088;

        h1 {
            margin: 0;
            font-size: 24px;
        }

        menu {
            margin: 0;
            a {
                padding: 0 1rem;
            }
        }
    }
    body > iframe {
        width: 100%;
        height: calc(100vh - var(--header-height));
    }
</style>
</head>
<body>
<header>
    <h1>Proximate Debugger</h1>
    <menu></menu>
</header>
<iframe name="main" src="viewer/feeds.html"></iframe>
<script src="viewer/common.js"></script>
<script>
    const menu = document.querySelector("body > header > menu");
    const frame = document.querySelector("body > iframe");
    function launch(key) {
        window.location.hash = key;
        frame.src = "/viewer/" + key + ".html?ts=" + Date.now();
    }
    ["feeds", "logs"].map(x => menu.appendChild(dom("a", {
        href: "#" + x,
        innerText: x,
        onclick: () => launch(x)
    })));
</script>
</body>
</html>
